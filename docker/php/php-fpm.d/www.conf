; Configuration PHP-FPM Production pour HRManager
; Optimisé pour un serveur avec 2GB RAM

[global]
pid = /var/run/php-fpm.pid
error_log = /var/log/php-fpm/error.log
daemonize = no

[www]
; User/group
user = www-data
group = www-data

; Socket ou TCP
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Manager - Dynamic pour adapter la charge
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 7
pm.max_requests = 1000

; Calcul pm.max_children:
; RAM disponible (2GB) - OS/MySQL (512MB) = 1.5GB
; 1.5GB / 75MB par processus PHP ≈ 20 children

; Restart après erreurs
pm.process_idle_timeout = 10s
pm.max_spawn_rate = 32

; Slow log pour détecter les requêtes lentes
request_slowlog_timeout = 10s
slowlog = /var/log/php-fpm/slow.log

; Timeout
catch_workers_output = yes
request_terminate_timeout = 60s

; Limites ressources
rlimit_files = 65535
rlimit_core = 0

; Variables d'environnement
clear_env = no

; Sécurité
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[allow_url_fopen] = off

; Logs
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/www-error.log
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Limite mémoire
php_admin_value[memory_limit] = 256M

; Upload max
php_admin_value[post_max_size] = 50M
php_admin_value[upload_max_filesize] = 50M

; Timezone
php_admin_value[date.timezone] = Europe/Paris

; Sessions - vers Redis
php_admin_value[session.save_handler] = redis
php_admin_value[session.save_path] = "tcp://redis:6379"
php_admin_value[session.gc_maxlifetime] = 3600
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = "Strict"

; Opcache - optimisé production
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.enable_cli] = 1
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[opcache.fast_shutdown] = 1
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.preload] = /var/www/config/preload.php
php_admin_value[opcache.preload_user] = www-data

; Limites fichiers ouverts
php_admin_value[max_file_uploads] = 20
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60
php_admin_value[max_input_vars] = 3000

; Afficher les erreurs (false en production)
php_flag[display_errors] = off
php_flag[display_startup_errors] = off
