# Configuration Nginx Production pour HRManager
# HTTPS + Let's Encrypt + Security Headers + Rate Limiting

# Zone de rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream php-fpm {
    server app:9000 max_fails=3 fail_timeout=30s;
}

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirection permanente vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Server HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrmanager.example.com;
    
    root /var/www/public;
    index index.php index.html;
    
    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/hrmanager.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrmanager.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hrmanager.example.com/chain.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    
    # Logs format JSON pour ELK/Loki
    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    gzip_min_length 1000;
    gzip_buffers 16 8k;
    
    # Client body size
    client_max_body_size 50M;
    client_body_buffer_size 16k;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Cache des assets statiques
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }
    
    # Fichiers uploadés (photos, documents)
    location /storage/ {
        alias /var/www/storage/app/public/;
        expires 1M;
        add_header Cache-Control "private, must-revalidate";
        try_files $uri =404;
    }
    
    # Rate limiting spécifique pour login
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        
        try_files $uri /index.php$is_args$args;
    }
    
    # API générale avec rate limiting
    location /api/ {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        
        try_files $uri /index.php$is_args$args;
    }
    
    # Health check (pas de rate limiting)
    location /api/health {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }
    
    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Buffers
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        
        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        
        # Cache
        fastcgi_cache_valid 200 302 1m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_use_stale error timeout invalid_header updating;
    }
    
    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny sensitive Laravel files
    location ~ ^/(\.env|\.gitignore|\.gitattributes|composer\.(json|lock)|artisan|phpunit\.xml|webpack\.mix\.js|package\.json|yarn\.lock) {
        deny all;
        return 404;
    }
    
    # Default location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}

# Log format JSON
log_format json_analytics escape=json '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id","request":"$request","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,"http_referer":"$http_referer","http_user_agent":"$http_user_agent","http_host":"$http_host","server_name":"$server_name","upstream_response_time":"$upstream_response_time","upstream_connect_time":"$upstream_connect_time","upstream_status":"$upstream_status","ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher"}';
