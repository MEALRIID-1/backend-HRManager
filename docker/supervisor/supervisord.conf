; Supervisor Configuration pour HRManager
; 3 workers queue + 1 scheduler

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; Configurer les logs
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log

; Nginx - Serveur Web
[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=4
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log

; Worker Queue 1 - Default Queue
[program:queue-worker-1]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=90 --queue=default
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker-1.log
stopwaitsecs=3600
priority=10
environment=HOME="/var/www",USER="www-data"

; Worker Queue 2 - High Priority
[program:queue-worker-2]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=90 --queue=high
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker-2.log
stopwaitsecs=3600
priority=11
environment=HOME="/var/www",USER="www-data"

; Worker Queue 3 - Emails et Notifications
[program:queue-worker-3]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --sleep=3 --tries=5 --timeout=120 --queue=emails,notifications
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker-3.log
stopwaitsecs=3600
priority=12
environment=HOME="/var/www",USER="www-data"

; Scheduler (Cron Replacement)
[program:scheduler]
command=php /var/www/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
priority=20
environment=HOME="/var/www",USER="www-data"

; Horizon (si utilisé, optionnel)
; [program:horizon]
; command=php /var/www/artisan horizon
; autostart=true
; autorestart=true
; user=www-data
; redirect_stderr=true
; stdout_logfile=/var/log/supervisor/horizon.log
; stopwaitsecs=3600
; priority=30

; Event group pour gérer tous ensemble
[group:hrmanager]
programs=nginx,php-fpm,queue-worker-1,queue-worker-2,queue-worker-3,scheduler
priority=999
