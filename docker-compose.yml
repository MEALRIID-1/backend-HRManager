version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrmanager_app
    restart: unless-stopped
    ports:
      - "8000:80"
    working_dir: /var/www
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=hrmanager
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - RUN_MIGRATIONS=true
      - RUN_SEEDERS=true
    volumes:
      - ./:/var/www
      - /var/www/vendor  # Volume anonyme pour préserver vendor de l'image
    networks:
      - hrmanager

  mysql:
    image: mysql:8.0
    container_name: hrmanager_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hrmanager
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: user
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hrmanager

  redis:
    image: redis:7-alpine
    container_name: hrmanager_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - hrmanager

  mailpit:
    image: axllent/mailpit
    container_name: hrmanager_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hrmanager

volumes:
  mysql_data:

networks:
  hrmanager:
    driver: bridge